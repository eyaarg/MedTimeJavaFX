<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Localisation cabinet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: Arial, sans-serif; background: #eef4fb; color: #0f172a; }

        #info-bar {
            height: 58px;
            background: linear-gradient(90deg, #2155d9 0%, #14a8df 100%);
            color: white;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #info-bar .title { font-size: 15px; font-weight: 700; }
        #info-bar .subtitle { font-size: 12px; opacity: 0.9; margin-top: 2px; }

        #map {
            position: relative;
            width: 100%;
            height: calc(100vh - 58px);
            overflow: hidden;
            background: #dbeafe;
        }

        .tile {
            position: absolute;
            width: 256px;
            height: 256px;
            border: 0;
        }

        #marker {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 28px;
            height: 28px;
            margin-left: -14px;
            margin-top: -28px;
            z-index: 50;
        }

        #marker:before {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            left: 2px;
            top: 0;
            background: #1d4ed8;
            border: 3px solid white;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.35);
        }

        #popup {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -132px);
            z-index: 60;
            min-width: 230px;
            max-width: 320px;
            background: white;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
            padding: 12px 14px;
            text-align: center;
        }

        #popup-name { color: #0f172a; font-size: 14px; font-weight: 700; margin-bottom: 5px; }
        #popup-address { color: #475569; font-size: 12px; line-height: 1.4; }

        #error-message {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            width: 360px;
            max-width: calc(100% - 40px);
            background: white;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
            padding: 22px;
            text-align: center;
        }

        #error-message h3 { color: #1d4ed8; margin-bottom: 8px; }
        #error-message p { color: #475569; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
<div id="info-bar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <div>
        <div class="title" id="bar-title">Cabinet medical</div>
        <div class="subtitle" id="bar-adresse">Chargement...</div>
    </div>
</div>

<div id="map">
    <div id="marker"></div>
    <div id="popup">
        <div id="popup-name">Cabinet medical</div>
        <div id="popup-address">Tunis, Tunisie</div>
    </div>
    <div id="error-message">
        <h3>Carte indisponible</h3>
        <p>OpenStreetMap ne peut pas charger les tuiles pour le moment. Verifiez la connexion Internet.</p>
    </div>
</div>

<script>
    var LAT = 36.8065;
    var LON = 10.1815;
    var NOM = "Cabinet medical";
    var ADRESSE = "Tunis, Tunisie";
    var ZOOM = 15;
    var TILE_SIZE = 256;
    var failedTiles = 0;

    function lonToTileX(lon, zoom) {
        return (lon + 180) / 360 * Math.pow(2, zoom);
    }

    function latToTileY(lat, zoom) {
        var rad = lat * Math.PI / 180;
        return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, zoom);
    }

    function clearTiles() {
        var map = document.getElementById("map");
        var tiles = map.getElementsByClassName("tile");
        while (tiles.length > 0) {
            map.removeChild(tiles[0]);
        }
    }

    function updateTexts() {
        document.getElementById("bar-title").textContent = NOM;
        document.getElementById("bar-adresse").textContent = ADRESSE;
        document.getElementById("popup-name").textContent = NOM;
        document.getElementById("popup-address").textContent = ADRESSE;
    }

    function showError() {
        document.getElementById("error-message").style.display = "block";
    }

    function renderMap() {
        var map = document.getElementById("map");
        var width = map.clientWidth || 750;
        var height = map.clientHeight || 492;
        var centerX = lonToTileX(LON, ZOOM) * TILE_SIZE;
        var centerY = latToTileY(LAT, ZOOM) * TILE_SIZE;
        var startX = Math.floor((centerX - width / 2) / TILE_SIZE);
        var endX = Math.floor((centerX + width / 2) / TILE_SIZE);
        var startY = Math.floor((centerY - height / 2) / TILE_SIZE);
        var endY = Math.floor((centerY + height / 2) / TILE_SIZE);
        var maxTile = Math.pow(2, ZOOM);

        failedTiles = 0;
        clearTiles();
        updateTexts();
        document.getElementById("error-message").style.display = "none";

        for (var x = startX; x <= endX; x++) {
            for (var y = startY; y <= endY; y++) {
                if (y < 0 || y >= maxTile) {
                    continue;
                }

                var normalizedX = ((x % maxTile) + maxTile) % maxTile;
                var img = document.createElement("img");
                img.className = "tile";
                img.src = "https://tile.openstreetmap.org/" + ZOOM + "/" + normalizedX + "/" + y + ".png";
                img.style.left = Math.round(x * TILE_SIZE - centerX + width / 2) + "px";
                img.style.top = Math.round(y * TILE_SIZE - centerY + height / 2) + "px";
                img.onerror = function() {
                    failedTiles++;
                    if (failedTiles > 3) {
                        showError();
                    }
                };
                map.insertBefore(img, map.firstChild);
            }
        }
    }

    function updateMap(lat, lon, nom, adresse) {
        LAT = Number(lat) || 36.8065;
        LON = Number(lon) || 10.1815;
        NOM = nom || "Cabinet medical";
        ADRESSE = adresse || "Tunis, Tunisie";
        renderMap();
    }

    window.onload = renderMap;
    window.onresize = renderMap;
</script>
</body>
</html>
